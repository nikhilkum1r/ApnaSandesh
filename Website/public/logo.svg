<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="tf-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="tf-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base rounded shield/tile -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tf-grad)" filter="url(#tf-shadow)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

  <!-- Chat bubble silhouette -->
  <path d="M12 22C12 16.477 16.477 12 22 12H26C31.523 12 36 16.477 36 22C36 27.523 31.523 32 26 32H20L14 36V30.8C12.75 28.3 12 25.3 12 22Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Signal / Flow waves inside bubble representing direct SIM SMS -->
  <path d="M18 20C18 19.4477 18.4477 19 19 19H29C29.5523 19 30 19.4477 30 20C30 20.5523 29.5523 21 29 21H19C18.4477 21 18 20.5523 18 20Z" fill="#059669" />
  <path d="M18 24C18 23.4477 18.4477 23 19 23H25C25.5523 23 26 23.4477 26 24C26 24.5523 25.5523 25 25 25H19C18.4477 25 18 24.5523 18 24Z" fill="#0d9488" />

  <!-- Small offline SIM chip / check dot -->
  <circle cx="28.5" cy="24" r="1.5" fill="#10b981" />
</svg>
